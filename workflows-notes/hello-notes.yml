# =====================================================================
# WORKFLOW: Hello CI
# Level 1 of CI/CD learning — installs real dependencies, starts a real
# Express app on a fresh machine, and verifies it responds to a request.
# =====================================================================

# The display name for this workflow, shown in the GitHub Actions tab.
# Purely cosmetic — doesn't affect how anything runs.
name: Hello CI

# Defines WHEN this workflow should run (the trigger).
on:
  # Trigger type: run when someone pushes code to the repo.
  push:
    # But only if the push was to the "main" branch specifically.
    branches: [main]

# Starts the list of jobs to run.
jobs:

  # The ID of this job — arbitrary name I chose ("say-hello").
  say-hello:

    # Runs this job on a fresh, temporary Ubuntu virtual machine,
    # provisioned on demand and destroyed after the job finishes.
    runs-on: ubuntu-latest

    # The ordered list of steps this job will run.
    steps:

      # --- Step 1 ---
      # Copies this repo's code onto the runner machine.
      # The VM starts out completely empty, so this must come first —
      # without it, later steps would have no code to install or run.
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Step 2 ---
      # Installs Node.js on the runner at the specified version, since
      # the VM doesn't come with a guaranteed Node version pre-installed.
      # (Note: GitHub deprecated Node 20 for running actions themselves,
      # so this is set to '24' to avoid the deprecation warning.)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # --- Step 3 ---
      # Installs this project's dependencies (Express, etc.) fresh,
      # based on package.json — proving the manifest is correct and
      # that nothing relies on packages only present on my own machine.
      - name: Install dependencies
        run: npm install

      # --- Step 4 ---
      # Starts the Express app in the background ("&" so the script
      # doesn't block waiting for it to exit), waits 2 seconds for it
      # to finish booting, then sends a request with curl to prove the
      # server is actually up and responding — not just that it started
      # without crashing.
      - name: Run the app briefly
        run: |
          node index.js &
          sleep 2
          curl http://localhost:3000

# =====================================================================
# KEY TAKEAWAYS
# =====================================================================
# 1. Every job starts on a completely fresh, empty machine — nothing
#    from my local setup (installed tools, cached packages) carries over.
#
# 2. actions/setup-node@v4 exists because Node isn't guaranteed to be
#    pre-installed at the version I need — I have to explicitly ask
#    for it as its own step.
#
# 3. "npm install" here is a real integration check: it proves
#    package.json accurately describes what the app needs to run.
#
# 4. Starting the app + curl-ing it is a crude but real way to verify
#    the app actually works, before real automated tests are introduced
#    in the next stage of learning.
# =====================================================================